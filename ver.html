<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010503">
<title>JANGOKÊ — Fila e ranking</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #010503; color: #e6f7ec; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
  button, input, textarea, select { font-family: 'Montserrat', sans-serif; }
  body { padding: 14px; max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
  h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; text-align: center; font-size: 40px; line-height: 1.1; letter-spacing: 2px; color: #fff; text-shadow: 0 0 4px #fff, 0 0 10px #ff2d95, 0 0 22px #ff2d95, 0 0 38px #ff2d95, 0 0 56px #00f0ff; margin: 10px 0 6px; }
  h2 { font-size: 22px; font-weight: 800; color: #9cc7ad; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #0a1d13; padding-bottom: 6px; margin: 26px 0 12px; }
  .card { background: #030a06; border: 1px solid #0a1d13; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card.first { border-color: #1e8f4e; }
  .card.ultimo { border-color: #ff4d4d; }
  .linha { font-size: 17px; padding: 8px 4px; border-bottom: 1px solid #0a1d13; }
  .linha .n { color: #9cc7ad; margin-right: 6px; }
  .linha .cod { color: #ffd33d; font-weight: bold; float: right; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nome { font-size: 20px; font-weight: bold; word-break: break-word; }
  .info { font-size: 14px; color: #9cc7ad; margin-top: 4px; }
  .musica { font-size: 15px; font-weight: 600; color: #cfe9d8; margin-top: 3px; clear: both; }
  .code { font-size: 30px; font-weight: bold; color: #ffd33d; flex-shrink: 0; }
  .score { font-size: 30px; font-weight: bold; color: #ffd33d; flex-shrink: 0; }
  .pos { font-size: 22px; font-weight: bold; color: #9cc7ad; min-width: 44px; text-align: center; flex-shrink: 0; }
  .tag { display: inline-block; background: #9cc7ad; color: #111; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  .tag.palco { background: #ffd33d; }
  .cnt { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 4px; }
  .cnt-zero { background: #39ff14; color: #04100a; }
  .cnt-um { background: #ffd33d; color: #111; }
  .cnt-mais { background: #5b6b63; color: #fff; }
  .tag.proximo { background: #39ff14; color: #04100a; }
  .mesa-chip { display: inline-block; color: #fff; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-left: 6px; vertical-align: middle; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .small { font-size: 13px; color: #7fae92; text-align: center; margin: 6px 0; }
  .rank-1 { border-color: #0f5c33; background: linear-gradient(90deg, #030f08, #030a06); padding: 16px 14px; }
  .rank-1 .pos { font-size: 36px; color: #ffd33d; }
  .rank-1 .nome { font-size: 30px; }
  .rank-1 .score { font-size: 60px; line-height: 1; }
  .rank-low { border-color: #ff4d4d; background: linear-gradient(90deg, #3a1313, #030a06); padding: 16px 14px; }
  .rank-low .pos, .rank-low .score { color: #ffd33d; }
  .rank-low .nome { font-size: 30px; }
  .rank-low .score { font-size: 60px; line-height: 1; }
  .btn-catalogo { display: block; width: 100%; margin: 4px 0 6px; padding: 14px; font-size: 18px; font-weight: bold; text-align: center; text-decoration: none; color: #fff; background: #17703d; border-radius: 12px; }
  .rank-card-x { position: relative; overflow: hidden; }
  .rank-card-x > * { position: relative; z-index: 1; }
  .bg-emoji { position: absolute !important; right: 4px; top: 50%; transform: translateY(-50%); font-size: 64px; opacity: 0.22; z-index: 0 !important; pointer-events: none; }
  .bg-emoji.bg-cold { left: 50%; right: auto; font-size: 150px; transform: translate(-50%, -50%) rotate(12deg); white-space: nowrap; }
</style>
</head>
<body>

  <h1>JANGOKÊ</h1>
  <p id="status" class="small">Carregando...</p>
  <a class="btn-catalogo" href="https://www.videoland.com.br/wwwroot/arquivos/Lista-Pacote-10765.pdf" target="_blank" rel="noopener">Catálogo de músicas</a>

  <h2>Fila - quem vai cantar</h2>
  <div id="fila"></div>

  <h2>Ranking</h2>
  <div id="ranking"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { mesaDe, ordenarFila, ordenarRanking, corDaMesa, faixaMusicas } from './fila.js';
import { CATALOGO } from './catalogo.js';
const musica = cod => CATALOGO[String(cod)] ? `<div class="musica">${esc(CATALOGO[String(cod)])}</div>` : '';

const firebaseApp = initializeApp({
  apiKey: 'AIzaSyD13Y66-paZkQsmlXRm3QAhJfs-x_UFJRU',
  authDomain: 'jangoke-karaoke.firebaseapp.com',
  projectId: 'jangoke-karaoke',
  storageBucket: 'jangoke-karaoke.firebasestorage.app',
  messagingSenderId: '775660173991',
  appId: '1:775660173991:web:a8880579c121a82a4ab982'
});
const DOC = doc(getFirestore(firebaseApp), 'karaoke', 'main');

function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function normalize(d) {
  d = d || {};
  return {
    clients: Array.isArray(d.clients) ? d.clients : [],
    queue: Array.isArray(d.queue) ? d.queue : [],
    performances: Array.isArray(d.performances) ? d.performances : [],
    nights: Array.isArray(d.nights) ? d.nights : []
  };
}
function nomeDe(db, id) {
  const c = db.clients.find(x => x.id === id);
  return c ? c.name : '?';
}
function cantou(db, id) {
  return db.performances.filter(p => p.clientId === id).length;
}

function desenhar(db) {
  const fila = ordenarFila(db);
  // Fila: só o 1º e o último ficam em destaque; os demais aparecem como texto simples
  const ultimoFila = fila.length - 1;
  document.getElementById('fila').innerHTML = fila.length ? fila.map((q, i) => {
    const nome = esc(nomeDe(db, q.clientId));
    const mesa = mesaDe(db, q.clientId);
    if (i !== 0 && i !== ultimoFila) {
      const mesaTxt = mesa === 'sem-mesa' ? '' : ` <span class="mesa-chip" style="background:${corDaMesa(mesa)}">Mesa ${esc(mesa)}</span>`;
      return `<div class="linha"><span class="n">${i + 1}º</span>${nome}${mesaTxt}<span class="cod">${esc(q.song)}</span>${musica(q.song)}</div>`;
    }
    const tagMesa = mesa === 'sem-mesa' ? '' : `<span class="mesa-chip" style="background:${corDaMesa(mesa)}">Mesa ${esc(mesa)}</span>`;
    const tagPalco = q.onStage ? '<span class="tag palco">NO PALCO</span>' : '';
    const tagAusente = q.absent ? '<span class="tag">AUSENTE</span>' : '';
    const tagProximo = i === 0 && !q.absent ? '<span class="tag proximo">PRÓXIMO</span>' : '';
    const cls = i === 0 ? 'first' : 'ultimo';
    return `<div class="card ${cls}">
      <div class="row">
        <div>
          <div class="nome">${nome}${tagMesa}${tagPalco}${tagProximo}${tagAusente}</div>
          ${musica(q.song)}
          <div class="info"><span class="cnt cnt-${faixaMusicas(cantou(db, q.clientId))}">${cantou(db, q.clientId)}x</span> música(s) já cantada(s)</div>
        </div>
        <div class="code">${esc(q.song)}</div>
      </div>
    </div>`;
  }).join('') : '<p class="small">Fila vazia</p>';

  // Ranking: 1º no topo, menor nota logo abaixo; só esses dois ficam em destaque
  const rank = ordenarRanking(db);
  if (!rank.length) {
    document.getElementById('ranking').innerHTML = '<p class="small">Ninguém cantou ainda</p>';
  } else {
    const ultimo = rank.length - 1;
    let ordem = rank.map((_, i) => i);
    if (rank.length > 2) ordem = [0, ultimo, ...ordem.filter(i => i !== 0 && i !== ultimo)];
    const menorNota = Math.min(...rank.map(p => p.score));
    document.getElementById('ranking').innerHTML = ordem.map(i => {
      const p = rank[i];
      const nome = esc(nomeDe(db, p.clientId));
      const ehUltimo = rank.length > 1 && i === ultimo && p.score === menorNota;
      if (i !== 0 && !ehUltimo) {
        return `<div class="linha"><span class="n">${i + 1}º</span>${nome}<span class="cod">${esc(p.score)}</span></div>`;
      }
      const cls = ehUltimo ? 'rank-low' : 'rank-1';
      const bg = i === 0 ? '<span class="bg-emoji bg-cold">👑✨</span>' : '<span class="bg-emoji bg-cold">💩😂</span>';
      const pos = ehUltimo ? '' : '🥇';
      return `<div class="card rank-card-x ${cls}">
        ${bg}
        <div class="row">
          <div class="pos">${pos}</div>
          <div class="nome" style="flex:1">${nome}</div>
          <div class="score">${esc(p.score)}</div>
        </div>
      </div>`;
    }).join('');
  }
}

onSnapshot(DOC, snap => {
  const db = normalize(snap.exists() ? snap.data().dados : null);
  desenhar(db);
  document.getElementById('status').textContent = '';
}, () => {
  document.getElementById('status').textContent = 'Não consegui carregar agora. Tente de novo em instantes.';
});
</script>
</body>
</html>
